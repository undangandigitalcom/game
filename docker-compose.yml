version: '3.8'

services:
  gameinvite-app:
    build: .
    container_name: gameinvite-saas
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VITE_API_URL=http://localhost:3001/api/v1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
